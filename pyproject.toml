[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cisa-kev-mcp"
version = "1.0.0"
description = "CISA Known Exploited Vulnerabilities feed + remediation deadlines for US federal + critical infrastructure operators."
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [{name = "MEOK AI Labs", email = "hello@meok.ai"}]
keywords = ["cisa", "kev", "vulnerability", "bod-22-01", "cyber", "federal", "mcp", "mcp-server", "model-context-protocol", "ai-governance"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["mcp>=1.0.0"]

[project.urls]
Homepage = "https://meok.ai"
Repository = "https://github.com/meok-ai-labs/cisa-kev-mcp"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["server.py"]

[project.scripts]
cisa-kev-mcp = "server:main"
